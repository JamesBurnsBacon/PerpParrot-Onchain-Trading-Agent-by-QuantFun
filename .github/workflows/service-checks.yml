# Tests and typechecks for the backend and executor (both against Postgres), plus the dashboard
# build. The review core (packages/backend/review, packages/shared/src, tests/) is checked by
# agent-review-checks.yaml. No secrets; scripts/e2e-mirror.sh runs a live end-to-end check locally.
name: Service checks

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "tests/support/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "supabase/migrations/**"
      - ".github/workflows/service-checks.yml"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend, executor]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    # The Postgres store tests (backend, executor) run only when TEST_DATABASE_URL is set.
    env:
      TEST_DATABASE_URL: postgres://postgres:pp@localhost:5432/postgres
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install review core dependencies for integration checks
        run: npm install --global pnpm@11.25.0 && pnpm --dir ../.. install --frozen-lockfile
        if: matrix.package == 'executor'
      - run: bun install --frozen-lockfile
      # The review core under packages/shared/src (the backend's selection pipeline imports it).
      - run: bun install --frozen-lockfile --cwd ../shared
      - name: Install integration dependency packages
        if: matrix.package == 'executor'
        run: bun install --frozen-lockfile --cwd ../backend
      - run: bun test
      - run: bunx tsc --noEmit

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
      - run: bun run build
